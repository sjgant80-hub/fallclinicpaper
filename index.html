<style>
:root{--void:#0b0a0f;--void-2:#13121a;--ink:#1a1922;--ink-2:#22212c;--line:#2a2934;--line-soft:#1f1e28;--cream:#e6e1d6;--cream-dim:#a8a395;--cream-muted:#6e6a5e;--brass:#b8974a;--amber:#ff8c00;--ox:#8b1a1a;--green:#4ade80;--red:#ef4444;--blue:#60a5fa;--yellow:#fbbf24;--serif:Georgia,'Libre Baskerville',ui-serif,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'IBM Plex Mono','SF Mono',ui-monospace,Menlo,monospace}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--void);color:var(--cream);font:14px/1.55 var(--sans);min-height:100dvh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;background:transparent;border:none;color:inherit}input,textarea,select{font-family:inherit;background:var(--ink);border:1px solid var(--line);color:var(--cream);border-radius:3px;padding:7px 10px;outline:none;font-size:13px}input:focus,textarea:focus,select:focus{border-color:var(--brass)}a{color:var(--brass)}
.app{min-height:100dvh;display:grid;grid-template-rows:48px 1fr}header{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--void-2);user-select:none}
.brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;border-right:1px solid var(--line)}.brand .mark{width:28px;height:28px;background:linear-gradient(135deg,var(--brass),var(--amber));border-radius:5px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:16px;color:var(--void)}.brand .name{font-family:var(--serif);font-weight:600;font-size:14px}.brand .seal{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.18em;text-transform:uppercase}
nav.tabs{display:flex;flex:1;overflow-x:auto;align-items:stretch}nav.tabs button{padding:0 14px;font-size:12px;color:var(--cream-dim);letter-spacing:0.04em;display:flex;align-items:center;border-right:1px solid var(--line-soft);height:100%;white-space:nowrap;border-top:2px solid transparent}nav.tabs button:hover{background:var(--ink);color:var(--cream)}nav.tabs button.active{background:var(--ink);color:var(--brass);border-top-color:var(--brass)}
.tools-r{display:flex;align-items:center;gap:5px;padding:0 14px;height:100%;border-left:1px solid var(--line)}.tool-btn{padding:5px 11px;border-radius:3px;font-size:11px;color:var(--cream-dim);letter-spacing:0.06em;text-transform:uppercase;font-family:var(--mono);border:1px solid var(--line)}.tool-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--brass)}
main{padding:18px 22px 60px;overflow-y:auto;max-width:1200px;margin:0 auto;width:100%}
.disclaimer{background:rgba(139,26,26,0.15);border:1px solid var(--ox);border-left:3px solid var(--ox);border-radius:3px;padding:12px 16px;margin-bottom:18px;font-size:12px}.disclaimer strong{color:var(--brass)}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;gap:14px;flex-wrap:wrap}.section-h h2{font-family:var(--serif);font-size:18px;font-weight:600}.section-h .sub{font-family:var(--mono);font-size:11px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}.section-h .actions{display:flex;gap:6px}
.card{background:var(--void-2);border:1px solid var(--line);border-radius:4px;padding:16px 18px;margin-bottom:14px}.card h3{font-family:var(--serif);font-size:14px;font-weight:600;margin-bottom:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.field label{display:block;font-family:var(--mono);font-size:10px;color:var(--cream-muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}.field input,.field select,.field textarea{width:100%}.field .hint{font-size:10px;color:var(--cream-muted);margin-top:3px;font-family:var(--mono)}
.btn{padding:7px 14px;border:1px solid var(--brass);border-radius:3px;font-size:12px;color:var(--cream);background:transparent}.btn:hover{border-color:var(--amber);color:var(--amber)}.btn.brass{background:var(--brass);color:var(--void);border-color:var(--brass);font-weight:600}.btn.brass:hover{background:var(--amber);border-color:var(--amber)}.btn.sm{padding:4px 9px;font-size:11px}.btn.ghost{border-color:var(--line);color:var(--cream-dim)}.btn.danger:hover{border-color:var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}th,td{padding:7px 10px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:top}th{color:var(--brass);font-family:var(--mono);font-size:10px;letter-spacing:0.08em;text-transform:uppercase;font-weight:600}
.pill{display:inline-block;padding:2px 7px;border-radius:11px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;border:1px solid var(--brass);color:var(--brass)}.pill.draft{border-color:var(--cream-muted);color:var(--cream-muted)}.pill.issued{border-color:var(--green);color:var(--green)}.pill.signed{border-color:var(--blue);color:var(--blue)}
.tpl-list{display:flex;flex-direction:column;gap:6px}.tpl-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:3px;cursor:pointer;background:var(--void-2)}.tpl-row:hover{border-color:var(--brass);background:var(--ink)}.tpl-row .nm{font-weight:600;font-size:13px}.tpl-row .sub{font-size:11px;color:var(--cream-muted);font-family:var(--mono)}
.doc-stage{display:grid;grid-template-columns:340px 1fr;gap:18px}.doc-side{display:flex;flex-direction:column;gap:12px}
.section-edit{margin-bottom:8px;border:1px solid var(--line);border-radius:3px;overflow:hidden}.section-edit .hd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--ink);font-size:12px}.section-edit .nm{font-weight:600}.section-edit .tg{font-family:var(--mono);font-size:9px;color:var(--cream-muted);letter-spacing:0.08em;text-transform:uppercase}.section-edit textarea{width:100%;border:none;border-top:1px solid var(--line);padding:8px 10px;font-size:12px;line-height:1.6;min-height:60px;resize:vertical}.section-edit.locked{border-color:var(--ox)}.section-edit.locked .hd{background:rgba(139,26,26,0.2)}.section-edit.locked .tg{color:var(--ox)}.section-edit.locked textarea{color:var(--cream-dim)}
.paper{background:#faf8f4;color:#1a1611;font-family:Georgia,serif;padding:40px 50px;border-radius:3px;font-size:13px;line-height:1.8;min-height:400px;max-height:80vh;overflow:auto}.paper strong{font-weight:700}.paper .doc-meta{font-family:var(--mono);font-size:10px;color:#888;border-bottom:1px solid #ccc;padding-bottom:8px;margin-bottom:16px}.paper .clause-locked{background:#f0ebd8;border-left:3px solid #8b1a1a;padding:8px 14px;margin:10px 0;font-size:12px}.paper .sig-block{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:24px}.paper .sig-line{border-bottom:1px solid #000;min-height:34px;margin-bottom:4px}.paper .placeholder-empty{color:#c00;background:#fee;padding:0 4px;border-radius:2px;font-family:var(--mono);font-size:11px}
.empty{padding:24px;text-align:center;color:var(--cream-muted);font-style:italic;font-size:12px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px}.msg{padding:10px 14px;border-radius:6px;max-width:88%;font-size:13px;line-height:1.55;white-space:pre-wrap}.msg.user{background:var(--ink);align-self:flex-end}.msg.bot{background:var(--void-2);border:1px solid var(--line);border-left:2px solid var(--brass);align-self:flex-start}.msg .src{font-family:var(--mono);font-size:10px;color:var(--cream-muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}.chat-input{display:flex;gap:8px;margin-top:10px}.chat-input input{flex:1;padding:11px 14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;padding:18px;z-index:900;backdrop-filter:blur(4px)}.modal-bg.open{display:flex}.modal{background:var(--void-2);border:1px solid var(--brass);border-radius:4px;padding:22px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modal h2{font-family:var(--serif);font-size:17px;margin-bottom:14px}.modal .actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:var(--void);padding:9px 18px;border-radius:3px;font-family:var(--mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:700;opacity:0;transition:all 0.22s;z-index:1100;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:760px){nav.tabs button{padding:0 10px;font-size:11px}main{padding:14px 14px 50px}.row{grid-template-columns:1fr}.doc-stage{grid-template-columns:1fr}}
</style>
</head>

<div class="app">
<header>
  <div class="brand"><div class="mark">◊</div><div><div class="name">FallClinicPaper</div></div><div class="seal">v1 · prime 937</div></div>
  <nav class="tabs" id="tabNav"></nav>
  <div class="tools-r"><button class="tool-btn" id="tierBadge" onclick="openModal('settings')">T0</button><button class="tool-btn" onclick="openModal('settings')">⚙</button></div>

</div>

<script>
'use strict';
const TOOLNAME='fallclinicpaper',VERSION='1.0.0',PRIME=937,STORE='fallclinicpaper-v1';
const TABS=[{id:'templates',label:'templates'},{id:'generate',label:'generate'},{id:'documents',label:'documents'},{id:'practice',label:'practice'},{id:'patients',label:'patients'},{id:'qa',label:'Q&A'}];

const TEMPLATE_DEFS=[
  {id:'referral',name:'Referral Letter',code:'REF-01',cat:'clinical',desc:'GP/specialist referral with clinical summary',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**REFERRAL LETTER**\n\nDate: {{ctx.date}}\nUrgency: {{ctx.urgency}}\n\nFrom: {{practice.name}}, {{practice.address}}\nClinician: {{ctx.clinician}}\n\nTo: {{ctx.referTo}}\nDepartment: {{ctx.department}}'},
    {id:'patient',name:'Patient Details',locked:false,text:'**Patient:** {{patient.name}}\n**DOB:** {{patient.dob}} · **NHS:** {{patient.nhsNumber}}\n**Address:** {{patient.address}}'},
    {id:'clinical',name:'Clinical Summary',locked:false,text:'**Presenting complaint:**\n{{ctx.presentingComplaint}}\n\n**History of presenting complaint:**\n{{ctx.hpc}}\n\n**Relevant past medical history:**\n{{ctx.pmh}}\n\n**Current medications:**\n{{ctx.medications}}\n\n**Allergies:**\n{{ctx.allergies}}\n\n**Examination findings:**\n{{ctx.examination}}\n\n**Investigations to date:**\n{{ctx.investigations}}'},
    {id:'request',name:'Request',locked:false,text:'**Reason for referral:**\n{{ctx.reasonForReferral}}\n\n**Specific questions:**\n{{ctx.questions}}'},
    {id:'footer',name:'Footer',locked:true,text:'This referral has been made with the patient\'s informed consent. Please contact the referring clinician if further information is required.\n\nThis letter contains confidential patient information and is intended for the named recipient only.'},
   ]},
  {id:'clinic-letter',name:'Clinic Letter',code:'CL-01',cat:'clinical',desc:'Post-consultation letter to GP / referrer',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**CLINIC LETTER**\n\nDate: {{ctx.date}}\n\n{{practice.name}}\n{{practice.address}}\n\nDear {{ctx.recipientName}},\n\nRe: {{patient.name}}, DOB: {{patient.dob}}, NHS: {{patient.nhsNumber}}'},
    {id:'body',name:'Body',locked:false,text:'Thank you for referring this patient who attended clinic on {{ctx.clinicDate}}.\n\n**Presenting complaint:** {{ctx.presentingComplaint}}\n\n**Examination:** {{ctx.examination}}\n\n**Diagnosis / Impression:** {{ctx.diagnosis}}\n\n**Plan:**\n{{ctx.plan}}'},
    {id:'footer',name:'Footer',locked:false,text:'I will review this patient in {{ctx.followUp}}. Please do not hesitate to contact me if you have any concerns.\n\nYours sincerely,\n\n{{ctx.clinician}}\n{{ctx.clinicianTitle}}'},
   ]},
  {id:'discharge',name:'Discharge Summary',code:'DS-01',cat:'clinical',desc:'Inpatient/day-case discharge summary',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**DISCHARGE SUMMARY**\n\nDate of discharge: {{ctx.dischargeDate}}\nDate of admission: {{ctx.admissionDate}}\nLength of stay: {{ctx.los}} days\n\n**Patient:** {{patient.name}}\n**DOB:** {{patient.dob}} · **NHS:** {{patient.nhsNumber}}\n**Ward:** {{ctx.ward}} · **Consultant:** {{ctx.consultant}}'},
    {id:'diagnosis',name:'Diagnoses',locked:false,text:'**Primary diagnosis:** {{ctx.primaryDiagnosis}}\n\n**Secondary diagnoses:**\n{{ctx.secondaryDiagnoses}}'},
    {id:'summary',name:'Clinical Summary',locked:false,text:'**Reason for admission:**\n{{ctx.reasonForAdmission}}\n\n**Key investigations:**\n{{ctx.investigations}}\n\n**Procedures performed:**\n{{ctx.procedures}}\n\n**Summary of inpatient stay:**\n{{ctx.inpatientSummary}}'},
    {id:'discharge-plan',name:'Discharge Plan',locked:false,text:'**Discharge medications:**\n{{ctx.dischargeMeds}}\n\n**Changes to regular medications:**\n{{ctx.medChanges}}\n\n**Follow-up:**\n{{ctx.followUp}}\n\n**GP actions required:**\n{{ctx.gpActions}}'},
    {id:'safety',name:'Safety Netting',locked:true,text:'The patient has been advised to seek urgent medical attention if:\n- Symptoms recur or worsen\n- New symptoms develop\n- They have concerns about their condition\n\nDischarge information leaflet provided: {{ctx.leafletProvided}}'},
   ]},
  {id:'prescription',name:'Prescription (FP10)',code:'RX-01',cat:'prescribing',desc:'NHS prescription form — FP10 equivalent',
   sections:[
    {id:'header',name:'Prescriber',locked:false,text:'**NHS PRESCRIPTION**\n\n**Prescriber:** {{ctx.prescriber}}\n**GMC/GPhC:** {{ctx.prescriberReg}}\n**Practice:** {{practice.name}}\n**Address:** {{practice.address}}'},
    {id:'patient',name:'Patient',locked:false,text:'**Patient:** {{patient.name}}\n**DOB:** {{patient.dob}} · **NHS:** {{patient.nhsNumber}}\n**Address:** {{patient.address}}'},
    {id:'items',name:'Prescription Items',locked:false,text:'{{ctx.item1}}\n{{ctx.item2}}\n{{ctx.item3}}\n{{ctx.item4}}'},
    {id:'prescribing-note',name:'Prescribing Note',locked:true,text:'This prescription is issued in accordance with the Human Medicines Regulations 2012. The prescriber has assessed the patient and determined that the prescribed medication(s) are clinically appropriate.\n\nAllergies checked: {{ctx.allergiesChecked}}\nInteractions checked: {{ctx.interactionsChecked}}\n\nControlled drug prescriptions must comply with the Misuse of Drugs Regulations 2001: quantity in words and figures, form, strength, dose, total quantity.'},
    {id:'sig',name:'Signature',locked:false,text:'Date: {{ctx.date}}\n[SIGNATURE_BLOCK]'},
   ]},
  {id:'fit-note',name:'Fit Note (Med3)',code:'MED3-01',cat:'occupational',desc:'Statement of Fitness for Work',
   sections:[
    {id:'header',name:'Header',locked:true,text:'**STATEMENT OF FITNESS FOR WORK**\nFor social security and Statutory Sick Pay purposes\n\n**Patient:** {{patient.name}}\n**NHS:** {{patient.nhsNumber}}'},
    {id:'assessment',name:'Assessment',locked:false,text:'I assessed your case on: {{ctx.assessmentDate}}\n\nBecause of the following condition(s): {{ctx.conditions}}\n\n☐ I advise you that you are not fit for work\n☐ I advise you that you may be fit for work taking account of the following advice'},
    {id:'advice',name:'Advice',locked:false,text:'If available, and with your employer\'s agreement, you may benefit from:\n\n☐ A phased return to work\n☐ Altered hours\n☐ Amended duties\n☐ Workplace adaptations\n\nComments: {{ctx.comments}}'},
    {id:'duration',name:'Duration',locked:false,text:'This will be the case from: {{ctx.fromDate}} to: {{ctx.toDate}}\n\nOr from: {{ctx.fromDate}} for: {{ctx.duration}}'},
    {id:'legal',name:'Legal',locked:true,text:'This statement is issued under the Social Security (Medical Evidence) Regulations 1976 (as amended). It is based on an assessment of the patient\'s fitness for work. The doctor is not required to assess the patient\'s fitness for a specific job.\n\nThe patient does not need to be seen again to return to work before the end date.'},
    {id:'sig',name:'Signature',locked:false,text:'Doctor\'s signature:\nDate: {{ctx.date}}\nDoctor\'s address: {{practice.address}}\n[SIGNATURE_BLOCK]'},
   ]},
  {id:'consent-form',name:'Consent Form',code:'CON-01',cat:'consent',desc:'Informed consent for treatment/procedure',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**CONSENT FORM**\n\n**Patient:** {{patient.name}}\n**DOB:** {{patient.dob}} · **NHS:** {{patient.nhsNumber}}\n**Date:** {{ctx.date}}'},
    {id:'procedure',name:'Procedure',locked:false,text:'**Proposed procedure / treatment:**\n{{ctx.procedure}}\n\n**Intended benefits:**\n{{ctx.benefits}}\n\n**Risks (including common and serious):**\n{{ctx.risks}}\n\n**Alternatives considered:**\n{{ctx.alternatives}}'},
    {id:'consent-statement',name:'Consent Statement',locked:true,text:'I confirm that:\n\n1. I have been given an explanation of the proposed procedure, including the risks, benefits, and alternatives\n2. I have had the opportunity to ask questions and have them answered to my satisfaction\n3. I understand that I may withdraw consent at any time before the procedure\n4. I give consent to the procedure described above\n\nI understand that the procedure may need to be modified during its course if clinically necessary. I give consent to any additional procedures that may be necessary to deal with unexpected findings or complications.\n\nThis consent is given voluntarily and without duress.'},
    {id:'sigs',name:'Signatures',locked:false,text:'[SIGNATURE_BLOCK]'},
   ]},
  {id:'dnar',name:'DNAR / ReSPECT',code:'DNAR-01',cat:'end-of-life',desc:'Do Not Attempt Resuscitation / ReSPECT form',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**DNACPR / ReSPECT DECISION**\n\n**Patient:** {{patient.name}}\n**DOB:** {{patient.dob}} · **NHS:** {{patient.nhsNumber}}\n**Date of decision:** {{ctx.decisionDate}}'},
    {id:'decision',name:'Decision',locked:false,text:'**Decision:**\nIn the event of cardiorespiratory arrest, cardiopulmonary resuscitation (CPR) should NOT be attempted.\n\n**Clinical basis for decision:**\n{{ctx.clinicalBasis}}\n\n**Patient\'s wishes / values:**\n{{ctx.patientWishes}}'},
    {id:'capacity',name:'Capacity & Discussion',locked:true,text:'Mental Capacity Act 2005 applies to this decision:\n\n1. Does the patient have capacity to participate in this decision?\n   {{ctx.hasCapacity}}\n\n2. If yes: has the decision been discussed with the patient?\n   This decision has been made in consultation with the patient / their representative.\n\n3. If no: has a best interest decision been made?\n   A best interest decision has been made in accordance with MCA 2005 s.4.\n\n4. LPA (Health & Welfare) consulted: {{ctx.lpaConsulted}}\n\nThis decision does not override any valid Advance Decision to Refuse Treatment (ADRT) under MCA 2005 ss.24-26.'},
    {id:'review',name:'Review',locked:false,text:'**Review date:** {{ctx.reviewDate}}\n**Senior clinician responsible:** {{ctx.seniorClinician}}\n**GMC number:** {{ctx.gmcNumber}}'},
   ]},
  {id:'death-cert',name:'Medical Certificate of Cause of Death',code:'MCCD-01',cat:'end-of-life',desc:'MCCD — Births and Deaths Registration Act 1953',
   sections:[
    {id:'header',name:'Header',locked:true,text:'**MEDICAL CERTIFICATE OF CAUSE OF DEATH**\nBirths and Deaths Registration Act 1953\n\n**Deceased:** {{patient.name}}\n**Date of death:** {{ctx.dateOfDeath}}\n**Place of death:** {{ctx.placeOfDeath}}\n**Age at death:** {{ctx.ageAtDeath}}'},
    {id:'cause',name:'Cause of Death',locked:false,text:'**I(a)** Disease or condition directly leading to death:\n{{ctx.causeIa}}\n\n**I(b)** Due to (or as a consequence of):\n{{ctx.causeIb}}\n\n**I(c)** Due to (or as a consequence of):\n{{ctx.causeIc}}\n\n**II** Other significant conditions contributing to death but not related to the cause given in I:\n{{ctx.causeII}}'},
    {id:'certifier',name:'Certifier',locked:false,text:'**Certifying doctor:** {{ctx.certifyingDoctor}}\n**GMC number:** {{ctx.gmcNumber}}\n**Qualifications:** {{ctx.qualifications}}\n\nI was the deceased\'s: {{ctx.relationship}}\n\nI last saw the deceased alive on: {{ctx.lastSeenAlive}}\n\nThe cause of death was: {{ctx.seenAfterDeath}}'},
    {id:'referral-note',name:'Coroner Referral',locked:true,text:'The death must be referred to the coroner if:\n- Cause of death is unknown\n- Death was violent or unnatural\n- Death occurred during an operation or before recovery from anaesthetic\n- Death occurred in custody or state detention\n- Death was sudden and unexplained\n- The deceased was not seen by a doctor within 28 days before death or after death\n- A MCCD cannot be issued\n\nCoroners and Justice Act 2009 applies.'},
   ]},
  {id:'sick-note',name:'Private Sick Note',code:'SN-01',cat:'occupational',desc:'Private medical certificate for employer',
   sections:[
    {id:'body',name:'Certificate',locked:false,text:'**PRIVATE MEDICAL CERTIFICATE**\n\nDate: {{ctx.date}}\n\nTo whom it may concern,\n\nThis is to certify that {{patient.name}} (DOB: {{patient.dob}}) attended this practice on {{ctx.attendanceDate}}.\n\nIn my opinion, {{ctx.pronoun}} is / was unfit for work from {{ctx.fromDate}} to {{ctx.toDate}} due to {{ctx.reason}}.\n\nThis certificate is issued privately and a fee of {{ctx.fee}} applies.\n\n{{ctx.clinician}}\n{{practice.name}}\n{{practice.address}}'},
   ]},
  {id:'med-report',name:'Medical Report (Access to Medical Reports Act)',code:'MR-01',cat:'occupational',desc:'Medical report for employer/insurer under AMRA 1988',
   sections:[
    {id:'header',name:'Header',locked:false,text:'**MEDICAL REPORT**\nAccess to Medical Reports Act 1988\n\nDate: {{ctx.date}}\nRequested by: {{ctx.requestedBy}}\n\n**Patient:** {{patient.name}}\n**DOB:** {{patient.dob}} · **NHS:** {{patient.nhsNumber}}'},
    {id:'consent-amra',name:'AMRA Consent',locked:true,text:'This report is prepared under the Access to Medical Reports Act 1988.\n\nThe patient has been informed of:\n1. Their right to consent to the report being supplied\n2. Their right to see the report before it is supplied\n3. Their right to request amendments\n4. Their right to withhold consent to the report being supplied\n\nPatient consent obtained: {{ctx.consentObtained}}\nPatient wishes to see report before supply: {{ctx.wantsToSeeReport}}'},
    {id:'report',name:'Report',locked:false,text:'**Relevant medical history:**\n{{ctx.medicalHistory}}\n\n**Current conditions:**\n{{ctx.currentConditions}}\n\n**Current treatment:**\n{{ctx.currentTreatment}}\n\n**Prognosis:**\n{{ctx.prognosis}}\n\n**Functional capacity:**\n{{ctx.functionalCapacity}}'},
    {id:'sig',name:'Signature',locked:false,text:'{{ctx.clinician}}\n{{ctx.gmcNumber}}\n{{practice.name}}\n\n[SIGNATURE_BLOCK]'},
   ]},
];

let state={active:'templates',firm:null,patients:[],documents:[],audit:[],
  ui:{selectedTemplate:null,selectedPatient:null,editingSections:{},extraContext:'',chat:[]},
  settings:{anthropicKey:'',auditChain:true}};

const $=(s,p=document)=>p.querySelector(s);const $$=(s,p=document)=>Array.from(p.querySelectorAll(s));
const uid=p=>(p||'')+'_'+Math.random().toString(36).slice(2,11);const now=()=>Date.now();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr=ts=>{if(!ts)return '—';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._to);t._to=setTimeout(()=>t.classList.remove('show'),1900)}
async function sha256(s){const buf=new TextEncoder().encode(s);const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('')}

let db;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(STORE,1);r.onupgradeneeded=e=>{const d=e.target.result;['state','audit','patients','firms','documents'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s==='state'?undefined:'id'})})};r.onsuccess=e=>{db=e.target.result;res(db)};r.onerror=rej})}
function idbGetAll(s){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])})}
function idbGet(s,k){return new Promise(res=>{const tx=db.transaction(s,'readonly');const q=tx.objectStore(s).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}
function idbPut(s,v,k){return new Promise(res=>{const tx=db.transaction(s,'readwrite');const o=tx.objectStore(s);const q=k!=null?o.put(v,k):o.put(v);q.onsuccess=()=>res(true);q.onerror=()=>res(false)})}
async function loadAll(){if(!db)await openDB();const[firms,patients,docs,auditArr,uiState]=await Promise.all([idbGetAll('firms'),idbGetAll('patients'),idbGetAll('documents'),idbGetAll('audit'),idbGet('state','ui')]);state.firm=firms[0]||null;state.patients=patients;state.documents=docs;state.audit=auditArr.sort((a,b)=>a.i-b.i);if(uiState){state.ui=Object.assign({},state.ui,uiState.value||{});state.settings=Object.assign({},state.settings,uiState.settings||{});}}
async function persistUI(){await idbPut('state',{value:{...state.ui},settings:state.settings},'ui')}
async function auditLog(action,opts={}){if(!state.settings.auditChain)return;const prev=state.audit.length?state.audit[state.audit.length-1]:null;const prevHash=prev?prev.docHash:'';const i=(prev?prev.i:0)+1;const entry={id:uid('au'),i,ts:now(),tool:TOOLNAME,action,reasoning:opts.reasoning||'',configVersion:TOOLNAME+'@'+VERSION,prevHash,docHash:'',payload:opts.payload||{}};entry.docHash=await sha256(JSON.stringify({i,ts:entry.ts,action,prevHash,payload:entry.payload}));state.audit.push(entry);await idbPut('audit',entry)}

let bcClinic,bcSignal;
function initMesh(){try{bcSignal=new BroadcastChannel('fall-signal');bcSignal.postMessage({source:TOOLNAME,type:'hello',prime:PRIME,version:VERSION,ts:now()})}catch(e){}try{bcClinic=new BroadcastChannel('fall-clinic');bcClinic.addEventListener('message',async e=>{const m=e.data;if(!m||m.source===TOOLNAME)return;if(m.type==='sync.snapshot'){const p=m.payload||{};if(Array.isArray(p.patients))for(const c of p.patients){if(!state.patients.find(x=>x.id===c.id)){state.patients.push(c);await idbPut('patients',c)}}if(p.firm&&!state.firm){state.firm=p.firm;await idbPut('firms',p.firm)}render()}});bcClinic.postMessage({v:1,type:'sync.request',ts:now(),source:TOOLNAME})}catch(e){}}

function buildContext(){
  const f=state.firm||{};const pt=state.ui.selectedPatient?state.patients.find(c=>c.id===state.ui.selectedPatient):null;
  const map={'practice.name':f.name||'','practice.address':f.address||'','practice.email':f.email||'','practice.phone':f.phone||''};
  if(pt){const d=pt.demographics||{};const m=pt.medical||{};map['patient.name']=((d.title||'')+' '+(d.firstName||'')+' '+(d.lastName||'')).trim();map['patient.dob']=d.dob||'';map['patient.nhsNumber']=d.nhsNumber||'';map['patient.address']=d.address||'';map['patient.phone']=d.phone||'';map['patient.email']=d.email||'';map['ctx.allergies']=(m.allergies||[]).map(a=>a.allergen+' ('+a.severity+')').join(', ')||'NKDA';map['ctx.medications']=(m.medications||[]).join(', ')||'nil regular'}
  const extra=(state.ui.extraContext||'').split('\n');for(const line of extra){const eq=line.indexOf('=');if(eq>0){const k='ctx.'+line.slice(0,eq).trim();map[k]=line.slice(eq+1).trim()}}
  return map;
}
function resolveText(text,ctx){return text.replace(/\{\{([^}]+)\}\}/g,(_,key)=>{const v=ctx[key.trim()];return v!=null&&v!==''?String(v):`<span class="placeholder-empty">{{${key.trim()}}}</span>`})}
function renderPaper(tpl,ctx,sections){const rendered=sections.map(s=>{const text=state.ui.editingSections?.[s.id]??s.text;const html=resolveText(text,ctx);if(s.locked)return `<div class="clause-locked">${mdBasic(html)}</div>`;return mdBasic(html)}).join('\n');return `<div class="doc-meta">${esc(tpl.name)} · ${esc(tpl.code)} · ${TOOLNAME} · ${dateStr(now())}</div>\n${rendered}`}
function mdBasic(md){return md.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'</p><p>').replace(/\n(\d+\.\s)/g,'<br>$1').replace(/\n-\s/g,'<br>• ').replace(/☐/g,'<span style="font-size:16px">☐</span>').replace(/\[SIGNATURE_BLOCK\]/g,'<div class="sig-block"><div><div class="sig-line"></div>Signed (Clinician)</div><div><div class="sig-line"></div>Signed (Patient)</div></div>').replace(/^/,'<p>').replace(/$/,'</p>')}

function render(){renderTabs();const v=$('#view');switch(state.active){case 'templates':return renderTemplates(v);case 'generate':return renderGenerate(v);case 'documents':return renderDocuments(v);case 'practice':return renderPractice(v);case 'patients':return renderPatients(v);case 'qa':return renderQA(v)}}
function renderTabs(){$('#tabNav').innerHTML=TABS.map(t=>`<button class="${state.active===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('')}
function switchTab(id){state.active=id;persistUI();render()}

function renderTemplates(v){
  const cats=[...new Set(TEMPLATE_DEFS.map(t=>t.cat))];
  v.innerHTML=`<div class="disclaimer"><strong>◊ Regulatory notice:</strong> FallClinicPaper generates clinical documents shaped by UK healthcare law and GMC guidance. Locked clauses contain regulatory/statutory wording. Editable sections are the clinician's responsibility. This tool does not replace clinical systems. Data never leaves this device.</div>
  <div class="section-h"><h2>Templates</h2><div class="sub">${TEMPLATE_DEFS.length} templates</div></div>
  ${cats.map(cat=>`<h3 style="font-family:var(--serif);margin:14px 0 8px;color:var(--brass);text-transform:capitalize">${cat}</h3><div class="tpl-list" style="margin-bottom:14px">${TEMPLATE_DEFS.filter(t=>t.cat===cat).map(t=>`<div class="tpl-row" onclick="selectTemplate('${t.id}')"><div><div class="nm">${esc(t.name)}</div><div class="sub">${esc(t.code)} · ${esc(t.desc)}</div></div><div class="sub">${t.sections.length} sections</div></div>`).join('')}</div>`).join('')}`;
}
function selectTemplate(id){state.ui.selectedTemplate=id;state.ui.editingSections={};state.active='generate';persistUI();render()}

function renderGenerate(v){
  const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);
  if(!tpl){v.innerHTML='<div class="empty"><h3>Select a template</h3><p>Go to Templates tab.</p></div>';return}
  const ctx=buildContext();
  v.innerHTML=`<div class="section-h"><h2>${esc(tpl.name)}</h2><div class="actions"><button class="btn brass sm" onclick="saveDocument('draft')">Save draft</button><button class="btn sm" style="border-color:var(--green);color:var(--green)" onclick="saveDocument('issued')">Issue</button><button class="btn ghost sm" onclick="printDoc()">Print</button></div></div>
  <div class="doc-stage">
    <div class="doc-side">
      <div class="card"><h3>Patient</h3><select id="patientSelect" style="width:100%" onchange="state.ui.selectedPatient=this.value;persistUI();render()"><option value="">— select —</option>${state.patients.map(p=>{const n=((p.demographics?.title||'')+' '+(p.demographics?.firstName||'')+' '+(p.demographics?.lastName||'')).trim()||p.id.slice(0,8);return `<option value="${p.id}" ${state.ui.selectedPatient===p.id?'selected':''}>${esc(n)}</option>`}).join('')}</select></div>
      <div class="card"><h3>Extra Context</h3><textarea id="ctxArea" rows="6" style="width:100%;font-size:11px" oninput="state.ui.extraContext=this.value">${esc(state.ui.extraContext||'')}</textarea><div class="field"><div class="hint">key=value per line · e.g. urgency=Urgent 2WW</div></div></div>
      <div class="card"><h3>Sections</h3>${tpl.sections.map(s=>`<div class="section-edit ${s.locked?'locked':''}"><div class="hd"><span class="nm">${esc(s.name)}</span><span class="tg">${s.locked?'locked':'editable'}</span></div><textarea rows="4" ${s.locked?'readonly':''} onchange="state.ui.editingSections['${s.id}']=this.value;renderPreview()">${esc(state.ui.editingSections?.[s.id]??s.text)}</textarea></div>`).join('')}</div>
    </div>
    <div><div class="paper" id="paperPreview">${renderPaper(tpl,ctx,tpl.sections)}</div></div>
  </div>`;
}
function renderPreview(){const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);if(!tpl)return;const ctx=buildContext();const pp=$('#paperPreview');if(pp)pp.innerHTML=renderPaper(tpl,ctx,tpl.sections)}
async function saveDocument(status){const tpl=TEMPLATE_DEFS.find(t=>t.id===state.ui.selectedTemplate);if(!tpl){toast('No template');return}const ctx=buildContext();const content=renderPaper(tpl,ctx,tpl.sections);const hash=await sha256(content);const doc={id:uid('doc'),templateId:tpl.id,templateName:tpl.name,code:tpl.code,patientId:state.ui.selectedPatient||'',status,content,hash:hash.slice(0,16),createdAt:now(),updatedAt:now(),sections:{...state.ui.editingSections},extraContext:state.ui.extraContext||''};state.documents.push(doc);await idbPut('documents',doc);await auditLog('document.'+status,{reasoning:tpl.name,payload:{docId:doc.id,hash:doc.hash}});toast(status==='issued'?'Issued':'Draft saved');persistUI();render()}
function printDoc(){const pp=$('#paperPreview');if(!pp)return;const w=window.open('','_blank');w.document.write('<!DOCTYPE html><html><head><title>Print</title><style>body{font-family:Georgia,serif;font-size:13px;line-height:1.7;padding:40px 60px;color:#1a1611}strong{font-weight:700}.clause-locked{background:#f5f0e0;border-left:3px solid #8b1a1a;padding:8px 12px;margin:8px 0;font-size:12px}.sig-block{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.sig-line{border-bottom:1px solid #000;min-height:38px;margin-bottom:4px}@media print{body{padding:20px}}</style></head><body>'+pp.innerHTML+'</body></html>');w.document.close();w.print()}

function renderDocuments(v){const docs=state.documents.sort((a,b)=>b.createdAt-a.createdAt);v.innerHTML=`<div class="section-h"><h2>Documents</h2><div class="sub">${docs.length} total</div></div>${docs.length?`<table><thead><tr><th>Date</th><th>Template</th><th>Code</th><th>Status</th><th>Hash</th></tr></thead><tbody>${docs.map(d=>`<tr><td>${dateStr(d.createdAt)}</td><td>${esc(d.templateName)}</td><td>${esc(d.code)}</td><td><span class="pill ${d.status}">${d.status}</span></td><td style="font-family:var(--mono);font-size:10px;color:var(--cream-muted)">${esc(d.hash)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No documents. Generate one from Templates.</div>'}`}

function renderPractice(v){const f=state.firm||{};v.innerHTML=`<div class="section-h"><h2>Practice Setup</h2></div><div class="card" style="max-width:620px"><div class="row"><div class="field"><label>Practice name</label><input id="fName" value="${esc(f.name||'')}"></div><div class="field"><label>Email</label><input id="fEmail" value="${esc(f.email||'')}"></div></div><div class="field"><label>Address</label><input id="fAddr" value="${esc(f.address||'')}"></div><div class="row"><div class="field"><label>Phone</label><input id="fPhone" value="${esc(f.phone||'')}"></div><div class="field"><label>CQC registration</label><input id="fCqc" value="${esc(f.cqcRegistration||'')}"></div></div><button class="btn brass" onclick="savePracticeForm()" style="margin-top:8px">Save</button></div>`}
async function savePracticeForm(){const f=state.firm||{id:uid('fi'),ts:now()};f.name=$('#fName').value.trim();f.email=$('#fEmail').value.trim();f.address=$('#fAddr').value.trim();f.phone=$('#fPhone').value.trim();f.cqcRegistration=$('#fCqc').value.trim();f.updatedAt=now();state.firm=f;await idbPut('firms',f);await auditLog('practice.saved');toast('Saved');render()}

function renderPatients(v){v.innerHTML=`<div class="section-h"><h2>Patients</h2><div class="sub">${state.patients.length}</div></div>${state.patients.length?`<table><thead><tr><th>Name</th><th>NHS</th><th>DOB</th></tr></thead><tbody>${state.patients.map(p=>{const d=p.demographics||{};const n=((d.title||'')+' '+(d.firstName||'')+' '+(d.lastName||'')).trim()||p.id.slice(0,8);return `<tr><td>${esc(n)}</td><td style="font-family:var(--mono);font-size:12px">${esc(d.nhsNumber||'—')}</td><td>${esc(d.dob||'—')}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">Patients sync from fallcliniconboard.</div>'}`}

const T0_QA=[
  {q:/referral|2ww|two.?week|urgent/i,a:'Referral letter should include: patient demographics, presenting complaint, HPC, PMH, current medications, allergies, examination findings, investigations, reason for referral, specific questions. Urgent (2WW) cancer referrals: NICE NG12 — suspected cancer pathway, must be seen within 14 days. Routine referrals: 18 weeks RTT (Referral to Treatment) target. E-referral via NHS e-RS preferred.'},
  {q:/prescription|fp10|controlled|drug/i,a:'FP10 prescriptions: must include patient name/address/DOB, prescriber details, medication (approved name preferred), dose, frequency, quantity, date. Controlled drugs (Misuse of Drugs Regulations 2001): quantity in words and figures, prescriber signature in ink, form/strength specified. Repeatable prescriptions: state number of repeats. Electronic prescribing (EPS) for most items.'},
  {q:/fit.?note|med3|sick|fitness/i,a:'Fit note (Med3/Statement of Fitness for Work): can state "not fit" or "may be fit" with adjustments. Valid for up to 3 months at a time. First 7 days: self-certification. From day 8: Med3 required. Adjustments: phased return, altered hours, amended duties, workplace adaptations. Backdating: up to 1 month if clinical records support. No obligation to see patient for return to work.'},
  {q:/consent|informed|capacity|gillick/i,a:'Informed consent requires: disclosure of procedure, risks (common and serious), benefits, alternatives, right to withdraw. Montgomery v Lanarkshire [2015] UKSC 11 — duty to disclose material risks. Adults: presumed to have capacity (MCA 2005). Under 16: Gillick competence. 16-17: presumed competent (Family Law Reform Act 1969 s.8). Consent forms should be procedure-specific.'},
  {q:/dnar|dnacpr|respect|resuscitation/i,a:'DNACPR: clinical decision about whether CPR would be successful or in the patient\'s best interest. ReSPECT: broader emergency care plan including CPR decision. Must be discussed with patient (if capacity) or LPA/family. Not the same as withdrawing treatment. MCA 2005 applies. Valid ADRT takes precedence. Review regularly. Tracey v Cambridge [2014] — duty to consult patient/family.'},
  {q:/discharge|summary|handover/i,a:'Discharge summary (NICE QS174): must include diagnosis, procedures, medications (including changes), follow-up plan, GP actions, safety netting. Send within 24 hours of discharge. Medication reconciliation at discharge (NICE NG5). Include allergies. Copies to GP and patient.'},
  {q:/death.?cert|mccd|coroner/i,a:'MCCD (Medical Certificate of Cause of Death): issued by doctor who attended the deceased during last illness. Must refer to coroner if: unknown cause, violent/unnatural, during operation, in custody, sudden/unexplained, not seen by doctor within 28 days. Births and Deaths Registration Act 1953. Death must be registered within 5 days. Medical examiner scrutiny introduced 2024.'},
  {q:/medical.?report|amra|access/i,a:'Access to Medical Reports Act 1988: patient must consent before employer/insurer can request medical report. Patient has right to see report before supply, request amendments, withhold consent. Separate from Subject Access Request (SAR) under GDPR. Report should be factual and relevant to the request. Fee chargeable (BMA guidance on fees).'},
];
function askT0(q){for(const r of T0_QA){if(r.q.test(q))return {answer:r.a,source:'T0 · UK clinical document rules'}}return null}
async function askT3(q){if(!state.settings.anthropicKey)return null;try{const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':state.settings.anthropicKey,'anthropic-version':'2023-06-01','content-type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:600,messages:[{role:'user',content:'You are a UK clinical documentation expert. GMC, NHS, prescribing, consent, referrals. Concise.\n\n'+q}]})});if(!res.ok)return null;const j=await res.json();return {answer:j.content?.[0]?.text,source:'T3 · Anthropic'}}catch(e){return null}}
function renderQA(v){v.innerHTML=`<div class="section-h"><h2>Q & A</h2><div class="sub">T0 + T3 BYOK</div></div><div class="card" style="max-width:780px"><div class="chat" id="chatBox">${(state.ui.chat||[]).map(m=>`<div class="msg ${m.role}">${esc(m.text)}${m.source?`<div class="src">${esc(m.source)}</div>`:''}</div>`).join('')}</div><div class="chat-input"><input id="chatIn" placeholder="Ask… 'FP10 requirements?' · 'Fit note rules?' · 'DNACPR guidance?'" onkeydown="if(event.key==='Enter')askQuestion()"><button class="btn brass" onclick="askQuestion()">Ask</button></div></div>`;const box=$('#chatBox');if(box)box.scrollTop=box.scrollHeight}
async function askQuestion(){const inp=$('#chatIn');if(!inp)return;const q=inp.value.trim();if(!q)return;inp.value='';if(!state.ui.chat)state.ui.chat=[];state.ui.chat.push({role:'user',text:q});render();let r=askT0(q);if(!r)r=await askT3(q);state.ui.chat.push(r?{role:'bot',text:r.answer,source:r.source}:{role:'bot',text:'No T0 match. Add BYOK key for T3.',source:'system'});persistUI();render()}

function openModal(type){const modal=$('#modal');$('#modalTitle').textContent='Settings';modal.classList.add('open');$('#modalBody').innerHTML=`<div class="field"><label>Anthropic key (T3)</label><input type="password" id="sKey" value="${esc(state.settings.anthropicKey||'')}"></div><div style="margin:10px 0"><label style="font-size:12px"><input type="checkbox" id="sAudit" ${state.settings.auditChain?'checked':''}> Audit chain</label></div><div class="actions"><button class="btn ghost sm" onclick="exportAll()">Export</button><button class="btn ghost sm" onclick="importAll()">Import</button><button class="btn danger sm" onclick="wipeAll()">Wipe</button><button class="btn brass" onclick="saveSettings()">Save</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`}
function closeModal(){$('#modal').classList.remove('open')}
function saveSettings(){state.settings.anthropicKey=$('#sKey').value.trim();state.settings.auditChain=$('#sAudit').checked;$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';persistUI();closeModal();toast('Saved');render()}
function exportAll(){const d={tool:TOOLNAME,v:VERSION,ts:now(),firm:state.firm,patients:state.patients,documents:state.documents};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='fallclinicpaper-export.json';a.click();URL.revokeObjectURL(u);toast('Exported')}
function importAll(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.firm){state.firm=d.firm;await idbPut('firms',d.firm)}for(const k of['patients','documents']){if(Array.isArray(d[k]))for(const r of d[k]){state[k].push(r);await idbPut(k,r)}}persistUI();toast('Imported');render()}catch(e){toast('Failed')}};inp.click()}
async function wipeAll(){if(!confirm('Wipe ALL data?'))return;for(const s of['patients','firms','documents','audit','state']){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();await new Promise(r=>{tx.oncomplete=r})}location.reload()}

async function seedDemo(){if(state.patients.length||state.firm)return;
  const firm={id:uid('fi'),name:'Demo Medical Centre',address:'1 Harley Street, London W1G 9QD',email:'reception@democlinic.nhs.uk',phone:'020 7123 4567',cqcRegistration:'CQC-1-234567890',updatedAt:now(),isDemo:true};
  state.firm=firm;await idbPut('firms',firm);
  const p1={id:uid('pt'),ts:now(),updatedAt:now(),isDemo:true,status:'complete',demographics:{title:'Mrs',firstName:'Margaret',lastName:'Thompson',dob:'1952-03-14',sex:'Female',nhsNumber:'9434765919',address:'42 Oak Lane, London N1 3RT',postcode:'N1 3RT',phone:'07700 900123',email:'m.thompson@email.co.uk'},medical:{conditions:['Type 2 diabetes','Hypertension'],allergies:[{allergen:'Penicillin',reaction:'Rash',severity:'moderate'}],medications:['Metformin 500mg BD','Amlodipine 5mg OD']},consent:{gdprConsent:true},safeguarding:{flagged:false}};
  const p2={id:uid('pt'),ts:now(),updatedAt:now(),isDemo:true,status:'new',demographics:{title:'Mr',firstName:'Amir',lastName:'Hassan',dob:'1988-07-22',sex:'Male',nhsNumber:'',address:'15 Elm Road, London E2 7QP'},medical:{conditions:[],allergies:[],medications:[]},consent:{},safeguarding:{}};
  state.patients.push(p1,p2);await idbPut('patients',p1);await idbPut('patients',p2);
  await auditLog('demo.seeded',{reasoning:'first boot'});await persistUI()}

(async function boot(){try{await openDB();await loadAll();await seedDemo();initMesh();$('#tierBadge').textContent=state.settings.anthropicKey?'T3':'T0';render()}catch(e){console.error('[fallclinicpaper] boot error:',e);document.getElementById('view').innerHTML='<div class="empty">Boot error: '+esc(e.message)+'</div>'}})();
</script>
